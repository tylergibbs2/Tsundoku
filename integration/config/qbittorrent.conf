[LegalNotice]
Accepted=true

[Preferences]
WebUI\Username=admin
WebUI\Port=8080
# qBittorrent 5.x invents a random temporary password on every fresh start and
# only prints it to the log, which makes automated configuration impossible.
# Whitelisting the caller instead means any credentials are accepted, so the
# environment is reproducible without pinning a PBKDF2 hash that changes format
# between releases. Safe here only because the published port is bound to
# 127.0.0.1 in compose.test.yml.
WebUI\LocalHostAuth=false
WebUI\AuthSubnetWhitelistEnabled=true
WebUI\AuthSubnetWhitelist=0.0.0.0/0

# Everything lands in one directory: Tsundoku is what moves files into the
# library, so the client must not do any sorting of its own.
Downloads\SavePath=/downloads
Downloads\TempPathEnabled=false

[BitTorrent]
# The swarm is one container talking to another over the compose network.
# Leaving DHT/PeX/LSD on would let peers be discovered without the tracker,
# which would quietly mask a broken tracker during testing.
Session\DHTEnabled=false
Session\PeXEnabled=false
Session\LSDEnabled=false
Session\Encryption=1
